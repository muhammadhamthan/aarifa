[project]
name = "arifaa-pack"
version = "0.1.0"
description = "Arifaa Pack client app: company config, prompts, plugins, entrypoints (api, worker, voice)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "kx-core-db",
    "kx-core-crm",
    "kx-core-automation",
    "kx-agent-framework[voice]",
    "uvicorn[standard]==0.54.0",
    "alembic==1.20.1",
    "sentry-sdk==2.73.0",
    "pyyaml==6.0.3",
]

[project.scripts]
kx = "arifaa_pack.cli:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arifaa_pack"]
