[project]
name = "kx-core-automation"
version = "0.1.0"
description = "Kairox automation: channels (WhatsApp, email, voice IVR), outbound gate, webhooks, jobs and timers, price scraping"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cryptography==50.0.2",
    "kx-core-db",
    "procrastinate==3.10.0",
    "psycopg[binary]==3.3.7",
    "psycopg-pool==3.3.3",
    "aioboto3==15.5.0",
    "twilio==9.12.0",
    "tenacity==9.2.1",
    "selectolax==1.0.2",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kx"]
