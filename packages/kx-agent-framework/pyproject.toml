[project]
name = "kx-agent-framework"
version = "0.1.0"
description = "Kairox agent framework: AgentSpec registry, orchestrator, LangGraph graphs, tools, guardrails, memory, voice routing"
requires-python = ">=3.14,<3.15"
dependencies = [
    "kx-core-db",
    "langgraph==1.2.19",
    "langchain==1.4.8",
    "langchain-core==1.7.4",
    "langchain-anthropic==1.7.9",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary]==3.3.7",
    "psycopg-pool==3.3.3",
    "pgvector==0.5.1",
    "langfuse==5.1.0",
]

[project.optional-dependencies]
voice = ["livekit-agents==1.8.10"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kx"]
