[project]
name = "kx-core-crm"
version = "0.1.0"
description = "Kairox CRM: contacts, deals, pricing engine, quotes, approvals, send grants, orders, stock, reports"
requires-python = ">=3.14,<3.15"
dependencies = [
    "kx-core-db",
    "jinja2==3.1.6",
    "weasyprint==70.0",
    "openpyxl==3.1.5",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kx"]
